<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formu detektīvs</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  :root{
    --bg:#FBF9F6;--surface:#fff;--line:#E3DCD4;--soft:#F4EFE9;
    --text:#1F3348;--muted:#6D7B88;--blue:#2E74B5;--terra:#C75000;
    --ok:#2D8A3E;--no:#C0392B;
  }
  html,body{height:100%;overflow:hidden;background:var(--bg);}
  body{font-family:'Candara','Aptos','Segoe UI',sans-serif;color:var(--text);-webkit-user-select:none;user-select:none;touch-action:none;}
  #frame{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden;}
  #stage{width:1600px;height:900px;flex:0 0 auto;transform-origin:center center;padding:22px 36px 22px;display:flex;flex-direction:column;position:relative;}
  header{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:14px;}
  h1{font-size:40px;letter-spacing:-0.5px;line-height:1;}
  h1 small{display:block;font-size:19px;color:var(--muted);letter-spacing:0;margin-top:6px;font-weight:400;}
  .tabs{display:flex;gap:8px;background:var(--soft);padding:6px;border-radius:18px;}
  .tab{font-family:inherit;font-size:21px;padding:11px 22px;border-radius:13px;border:0;background:transparent;color:var(--text);cursor:pointer;}
  .tab.on{background:var(--blue);color:#fff;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px 20px;}
  .label{font-size:14px;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;}
  .btn{font-family:inherit;font-size:20px;padding:12px 22px;border-radius:14px;border:1px solid var(--line);background:#fff;color:var(--text);cursor:pointer;}
  .btn.main{background:var(--blue);border-color:var(--blue);color:#fff;}
  .btn.terra{background:var(--terra);border-color:var(--terra);color:#fff;}
  .btn:active{transform:scale(0.97);}
  .btn:focus-visible,.tab:focus-visible{outline:4px solid var(--terra);outline-offset:3px;}
  .btn[disabled]{opacity:.4;cursor:default;}

  .main{display:flex;gap:22px;flex:1;min-height:0;}
  .objs{width:190px;flex-shrink:0;display:flex;flex-direction:column;gap:9px;}
  .obj{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--line);border-radius:16px;padding:6px 10px;cursor:pointer;font-family:inherit;text-align:left;color:var(--text);}
  .obj svg{width:62px;height:62px;flex-shrink:0;}
  .obj b{font-size:19px;display:block;line-height:1.1;}
  .obj span{font-size:14px;color:var(--muted);}
  .obj.on{border-color:var(--blue);background:#EEF4FB;}
  .paper{width:790px;flex-shrink:0;background:#fff;border:1px solid var(--line);border-radius:24px;display:flex;align-items:center;justify-content:center;position:relative;}
  #pic{width:720px;height:720px;}
  #pic .part{transition:opacity .35s,transform .45s;transform-box:fill-box;transform-origin:center;}
  #pic .part.hid{opacity:0;transform:scale(.4);}
  #pic .part.ghost{opacity:.18;}
  #pic.find .part.fig{cursor:pointer;}
  #pic .part.found{stroke:#1F3348;stroke-width:5;stroke-dasharray:14 8;}
  #pic .part.now{stroke:var(--terra);stroke-width:6;}
  #pic .part.flash{animation:flash .7s;}
  @keyframes flash{0%,100%{filter:none}50%{filter:brightness(1.35) drop-shadow(0 0 10px #C75000)}}
  .side{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px;}
  .legend{display:flex;flex-direction:column;gap:7px;}
  .lg{display:flex;align-items:center;gap:12px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:6px 12px;cursor:pointer;font-family:inherit;color:var(--text);text-align:left;}
  .lg svg{width:42px;height:42px;flex-shrink:0;}
  .lg b{font-size:20px;flex:1;}
  .lg i{font-style:normal;font-size:19px;color:var(--muted);min-width:52px;text-align:right;}
  .lg.done i{color:var(--ok);font-weight:700;}
  .lg.pulse{animation:flash .7s;}
  .lg.none{opacity:.45;}
  .info{font-size:19px;line-height:1.45;min-height:110px;}
  .info b{color:var(--terra);font-size:22px;}
  .prog{font-size:22px;}
  .steps{display:flex;flex-direction:column;gap:8px;}
  .st{display:flex;gap:12px;align-items:center;padding:10px 14px;border-radius:14px;background:#fff;border:2px solid var(--line);font-size:20px;}
  .st .n{width:40px;height:40px;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;}
  .st.on{border-color:var(--terra);background:#FDF1E9;}
  .st.on .n{background:var(--terra);color:#fff;}
  .st.past .n{background:var(--ok);color:#fff;}
  .stext{font-size:20px;line-height:1.45;}
  .row{display:flex;gap:10px;}
  .row .btn{flex:1;text-align:center;display:flex;justify-content:center;}
</style>
</head>
<body>
<div id="frame"><div id="stage">
  <header>
    <h1>Formu detektīvs<small>Kādas ģeometriskās figūras slēpjas svētku simbolos?</small></h1>
    <div class="tabs">
      <button class="tab on" data-mode="find">Atrodi figūras</button>
      <button class="tab" data-mode="steps">Soli pa solim</button>
    </div>
  </header>
  <div class="main">
    <div class="objs" id="objs"></div>
    <div class="paper"><svg id="pic" class="find" viewBox="0 0 600 600"></svg></div>

    <div class="side" id="findP">
      <div class="card" style="padding:14px 18px">
        <div class="prog">Atrastas figūras: <b id="fc">0</b> no <b id="ft">0</b></div>
        <p style="font-size:17px;color:var(--muted);margin-top:4px">Pieskaries katrai figūrai zīmējumā.</p>
      </div>
      <div class="legend" id="legend"></div>
      <div class="card info" id="info">Pieskaries figūrai zīmējumā vai figūras nosaukumam, lai uzzinātu tās īpašības.</div>
      <div class="row" style="margin-top:auto"><button class="btn" id="showAll">Parādi visas</button><button class="btn" id="again">No jauna</button></div>
    </div>

    <div class="side" id="stepP" style="display:none">
      <div class="steps" id="steps"></div>
      <div class="card stext" id="stext"></div>
      <div class="row" style="margin-top:auto">
        <button class="btn" id="prev">◀ Atpakaļ</button>
        <button class="btn main" id="next">Tālāk ▶</button>
      </div>
    </div>
  </div>
</div></div>

window.addEventListener('resize',()=>{fit();reportHeight();});
window.addEventListener('load',()=>{fit();reportHeight();});
fit();reportHeight();

/* palīgfunkcijas figūru veidošanai */
const C=(f,s,cx,cy,r,fill,x)=>Object.assign({f,s,el:'circle',a:{cx,cy,r},fill},x||{});
const E=(f,s,cx,cy,rx,ry,fill,x)=>Object.assign({f,s,el:'ellipse',a:{cx,cy,rx,ry},fill},x||{});
const Rc=(f,s,x0,y0,w,h,fill,x)=>Object.assign({f,s,el:'rect',a:{x:x0,y:y0,width:w,height:h},fill},x||{});
const P=(f,s,pts,fill,x)=>Object.assign({f,s,el:'polygon',a:{points:pts},fill},x||{});
const L=(s,x1,y1,x2,y2,col,w)=>({f:null,s,el:'line',a:{x1,y1,x2,y2,stroke:col,'stroke-width':w||5,'stroke-linecap':'round'}});

function sunRays(){const r=[];for(let i=0;i<8;i++){const a=i*Math.PI/4,b=0.2;const p=(rr,aa)=>(300+rr*Math.cos(aa)).toFixed(1)+','+(300+rr*Math.sin(aa)).toFixed(1);r.push(P('trissturis',2,p(160,a-b)+' '+p(275,a)+' '+p(160,a+b),'#F2B01E'));}return r;}
function sunDots(){const r=[];for(let i=0;i<8;i++){const a=i*Math.PI/4+Math.PI/8;r.push(C('aplis',3,(300+122*Math.cos(a)).toFixed(1),(300+122*Math.sin(a)).toFixed(1),13,'#C75000'));}return r;}
function zig(y,dir){const r=[];for(let i=0;i<6;i++){const x=110+i*63.3;r.push(P('trissturis',2,`${x},${y} ${x+31.6},${y+dir*55} ${x+63.3},${y}`,'#F2B01E',{clip:1}));}return r;}

const NS='http://www.w3.org/2000/svg';
const pic=document.getElementById('pic');
let obj=0,mode='find',step=0,found=new Set();
function render(){
  const o=OBJ[obj];pic.innerHTML='';
  const hasClip=o.parts.some(p=>p.clip);
  if(hasClip){const base=o.parts.find(p=>p.s===1);pic.innerHTML=`<defs><clipPath id="cl"><ellipse cx="${base.a.cx}" cy="${base.a.cy}" rx="${base.a.rx}" ry="${base.a.ry}"/></clipPath></defs>`;}
  o.parts.forEach((p,i)=>{
    const el=document.createElementNS(NS,p.el);
    for(const k in p.a)el.setAttribute(k,p.a[k]);
    if(p.fill)el.setAttribute('fill',p.fill);
    ['stroke','stroke-width'].forEach(k=>{if(p[k])el.setAttribute(k,p[k]);});

    if(p.clip)el.setAttribute('clip-path','url(#cl)');
    el.classList.add('part');if(p.f)el.classList.add('fig');
    el.dataset.i=i;
    if(p.f)el.addEventListener('click',()=>onPart(i,el));
    if(p.rot){const g=document.createElementNS(NS,'g');g.setAttribute('transform',`rotate(${p.rot} ${p.a.cx} ${p.a.cy})`);g.appendChild(el);pic.appendChild(g);}
    else pic.appendChild(el);
  });
  update();
}
function update(){
  const o=OBJ[obj];
  pic.querySelectorAll('.part').forEach(el=>{
    const p=o.parts[+el.dataset.i];
    el.classList.remove('hid','found','now','ghost');
    if(p.stroke)el.setAttribute('stroke',p.stroke);
    if(mode==='find'){if(found.has(+el.dataset.i))el.classList.add('found');}
    else{
      if(p.s>step)el.classList.add('hid');
      else if(p.s===step&&p.f)el.classList.add('now');
    }
  });
  if(mode==='find')updLegend();else updSteps();
}
/* ── atrodi ── */
function onPart(i,el){
  if(mode!=='find')return;
  const p=OBJ[obj].parts[i];
  found.add(i);el.classList.remove('flash');void el.getBBox();el.classList.add('flash');
  update();
  const lg=document.querySelector('.lg[data-f="'+p.f+'"]');if(lg){lg.classList.remove('pulse');void lg.offsetWidth;lg.classList.add('pulse');}
  showInfo(p.f,true);
}
function showInfo(f,foundIt){
  document.getElementById('info').innerHTML=(foundIt?'Tu atradi: ':'')+'<b>'+FIG[f].n.toUpperCase()+'</b><br>'+FIG[f].t;
}
function updLegend(){
  const o=OBJ[obj];const figs=o.parts.map((p,i)=>[p,i]).filter(([p])=>p.f);
  document.getElementById('fc').textContent=figs.filter(([,i])=>found.has(i)).length;
  document.getElementById('ft').textContent=figs.length;
  document.getElementById('legend').innerHTML=Object.keys(FIG).map(f=>{
    const all=figs.filter(([p])=>p.f===f),got=all.filter(([,i])=>found.has(i)).length;
    return `<button class="lg ${all.length&&got===all.length?'done':''} ${all.length?'':'none'}" data-f="${f}"><svg viewBox="0 0 100 100">${FIG[f].svg}</svg><b>${FIG[f].n}</b><i>${all.length?got+' / '+all.length:'—'}</i></button>`;
  }).join('');
  document.querySelectorAll('.lg').forEach(b=>b.addEventListener('click',()=>showInfo(b.dataset.f,false)));
  if(figs.length&&figs.every(([,i])=>found.has(i)))document.getElementById('info').innerHTML='<b>🎉 VISAS FIGŪRAS ATRASTAS!</b><br>Tagad pamēģini režīmu „Soli pa solim” un uzzini, kā šo simbolu zīmēt.';
}
document.getElementById('showAll').onclick=()=>{OBJ[obj].parts.forEach((p,i)=>{if(p.f)found.add(i);});update();};
document.getElementById('again').onclick=()=>{found.clear();update();document.getElementById('info').innerHTML='Pieskaries figūrai zīmējumā vai figūras nosaukumam, lai uzzinātu tās īpašības.';};
/* ── soli pa solim ── */
const SNAMES=['Tukša lapa','Lielās formas','Vidējās formas','Detaļas'];
function updSteps(){
  document.getElementById('steps').innerHTML=[1,2,3].map(n=>`<div class="st ${n===step?'on':''} ${n<step?'past':''}"><span class="n">${n<step?'✓':n}</span>${n}. solis — ${SNAMES[n]}</div>`).join('');
  const o=OBJ[obj];
  document.getElementById('stext').innerHTML=step===0?'Kad zīmē svētku simbolu, <b>vispirms zīmē lielās formas</b> un tikai pēc tam — detaļas. Tā zīmējums būs pareizā lielumā un vietā.<br><br>Spied <b>„Tālāk”</b>!':o.steps[step-1]+(step===3?'<br><br><b>Gatavs!</b> Tagad pamēģini uzgleznot pats.':'');
  document.getElementById('prev').disabled=step===0;
  document.getElementById('next').disabled=step===3;
}
document.getElementById('prev').onclick=()=>{if(step>0){step--;update();}};
document.getElementById('next').onclick=()=>{if(step<3){step++;update();}};

/* ── objekti ── */
document.getElementById('objs').innerHTML=OBJ.map((o,i)=>`<button class="obj ${i===0?'on':''}" data-i="${i}">${iconSVG(o.k==='kirbis'?'kirbis':o.k)}<div><b>${o.name}</b><span>${o.hol}</span></div></button>`).join('');
document.querySelectorAll('.obj').forEach(b=>b.addEventListener('click',()=>{
  obj=+b.dataset.i;found.clear();step=0;
  document.querySelectorAll('.obj').forEach(x=>x.classList.toggle('on',x===b));
  document.getElementById('info').innerHTML='Pieskaries figūrai zīmējumā vai figūras nosaukumam, lai uzzinātu tās īpašības.';
  render();
}));
document.querySelectorAll('header .tab').forEach(b=>b.addEventListener('click',()=>{
  mode=b.dataset.mode;step=0;
  document.querySelectorAll('header .tab').forEach(x=>x.classList.toggle('on',x===b));
  document.getElementById('findP').style.display=mode==='find'?'flex':'none';
  document.getElementById('stepP').style.display=mode==='steps'?'flex':'none';
  pic.classList.toggle('find',mode==='find');
  update();
}));
render();
</script>
